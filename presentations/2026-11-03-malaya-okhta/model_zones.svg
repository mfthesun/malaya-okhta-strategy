<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="model-title model-desc" font-family="'Geist','Inter',sans-serif">
  <title id="model-title">Пространственная модель Малой Охты: четыре зоны режимов развития</title>
  <desc id="model-desc">Схема из четырёх зон: мыс с Ниеншанцем как музейно-общественное ядро, берег Охты с КРТ, жилые суперблоки в режиме наполнения и восточный резерв; фокус на зоне З1.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#52514E"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#B33A2B"/>
    </marker>
  </defs>
  <rect width="1920" height="1080" fill="#F4F7FA"/>
  <text x="280" y="124" fill="#52514E" font-size="14" font-family="'Geist Mono','Inter',monospace" letter-spacing="0.14em">РЕЖИМЫ РАЗВИТИЯ ТЕРРИТОРИИ</text>
  <text x="280" y="156" fill="#141414" font-size="22" font-weight="600" font-family="'Geist','Inter',sans-serif">от ядра атаки к восточному резерву</text>
  <path d="M 224 310 L 224 200" stroke="#52514E" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="204" y="255.0" fill="#6B6B6B" font-size="12" font-family="'Geist Mono','Inter',monospace" letter-spacing="0.1em" transform="rotate(-90 204 255.0)" text-anchor="middle">ПРИОРИТЕТ</text>
  <rect x="280" y="180" width="1400" height="150" rx="6" fill="#F4F7FA"/>
  <rect x="280" y="180" width="1400" height="150" rx="6" fill="#E8EEF4" stroke="#52514E" stroke-width="1"/>
  <rect x="296" y="204" width="56" height="20" rx="2" fill="none" stroke="#52514E" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="324" y="218" fill="#52514E" font-size="12" font-family="'Geist Mono','Inter',monospace" text-anchor="middle" letter-spacing="0.08em">З4</text>
  <text x="380" y="242" fill="#141414" font-size="26" font-weight="600" font-family="'Geist','Inter',sans-serif">Восточный резерв</text>
  <text x="380" y="280" fill="#6B6B6B" font-size="16" font-family="'Geist','Inter',sans-serif">зелёно-рекреационное развитие · 3-я очередь</text>
  <rect x="280" y="354" width="1400" height="150" rx="6" fill="#F4F7FA"/>
  <rect x="280" y="354" width="1400" height="150" rx="6" fill="#E8EEF4" stroke="#52514E" stroke-width="1"/>
  <rect x="296" y="378" width="56" height="20" rx="2" fill="none" stroke="#52514E" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="324" y="392" fill="#52514E" font-size="12" font-family="'Geist Mono','Inter',monospace" text-anchor="middle" letter-spacing="0.08em">З3</text>
  <text x="380" y="416" fill="#141414" font-size="26" font-weight="600" font-family="'Geist','Inter',sans-serif">Жилые суперблоки</text>
  <text x="380" y="454" fill="#6B6B6B" font-size="16" font-family="'Geist','Inter',sans-serif">режим наполнения: дворы, сервисы, зелёный каркас · 1–3-я очереди</text>
  <rect x="280" y="528" width="1400" height="150" rx="6" fill="#F4F7FA"/>
  <rect x="280" y="528" width="1400" height="150" rx="6" fill="#E8EEF4" stroke="#52514E" stroke-width="1"/>
  <rect x="296" y="552" width="56" height="20" rx="2" fill="none" stroke="#52514E" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="324" y="566" fill="#52514E" font-size="12" font-family="'Geist Mono','Inter',monospace" text-anchor="middle" letter-spacing="0.08em">З2</text>
  <text x="380" y="590" fill="#141414" font-size="26" font-weight="600" font-family="'Geist','Inter',sans-serif">Берег Охты</text>
  <text x="380" y="628" fill="#6B6B6B" font-size="16" font-family="'Geist','Inter',sans-serif">КРТ промзон со смешанными функциями · 2–3-я очереди</text>
  <rect x="280" y="702" width="1400" height="150" rx="6" fill="#F4F7FA"/>
  <rect x="280" y="702" width="1400" height="150" rx="6" fill="rgba(179,58,43,0.08)" stroke="#B33A2B" stroke-width="1.2"/>
  <rect x="296" y="726" width="56" height="20" rx="2" fill="none" stroke="#B33A2B" stroke-opacity="0.5" stroke-width="0.8"/>
  <text x="324" y="740" fill="#B33A2B" font-size="12" font-family="'Geist Mono','Inter',monospace" text-anchor="middle" letter-spacing="0.08em">З1</text>
  <text x="380" y="764" fill="#141414" font-size="26" font-weight="600" font-family="'Geist','Inter',sans-serif">Мыс: Ниеншанц</text>
  <text x="380" y="802" fill="#6B6B6B" font-size="16" font-family="'Geist','Inter',sans-serif">музейно-общественное ядро · флагман 1-й очереди (2029)</text>
  <line x1="280" y1="880" x2="1680" y2="880" stroke="rgba(20,20,20,0.12)" stroke-width="0.8"/>
  <text x="280" y="908" fill="#52514E" font-size="12" font-family="'Geist Mono','Inter',monospace" letter-spacing="0.14em">КАРКАСЫ</text>
  <text x="420" y="908" fill="#6B6B6B" font-size="14" font-family="'Geist','Inter',sans-serif">водно-общественный · зелёно-пешеходный · сервисный (узлы 400 м) · историко-культурный</text>
  <text x="280" y="940" fill="#52514E" font-size="12" font-family="'Geist Mono','Inter',monospace" letter-spacing="0.14em">УЗЛЫ</text>
  <text x="420" y="940" fill="#6B6B6B" font-size="14" font-family="'Geist','Inter',sans-serif">Охтинский мыс · «Новочеркасская» · «Ладожская» · Уткина дача</text>
</svg>